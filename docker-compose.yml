services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hobbes
      POSTGRES_USER: hobbes
      POSTGRES_PASSWORD: hobbes
    ports: ["5432:5432"]
    volumes: ["hobbes_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hobbes -d hobbes"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hobbes_postgres:
