name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Only the repository owner can summon the agent.
    if: |
      github.event.comment.author_association == 'OWNER' &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check OpenRouter secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.HOBBES_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          key = os.environ.get("OPENROUTER_API_KEY", "")
          if not key.strip():
              print("::error::HOBBES_API_KEY is missing or empty. Add it under Settings > Secrets and variables > Actions > Repository secrets. Environment secrets are not available to this job because it declares no environment.")
              sys.exit(1)
          if key != key.strip():
              print("::error::HOBBES_API_KEY contains surrounding whitespace. Save the raw key without spaces or newlines.")
              sys.exit(1)
          print("OpenRouter secret is present. This check does not validate the key or account balance.")
          PY

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.HOBBES_API_KEY }}
        with:
          model: openrouter/z-ai/glm-5.3
          agent: ${{ contains(github.event.comment.body, '/oc plan') && 'plan' || 'build' }}
          share: false
